<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index Nocturne · Impeccable fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #11110f;
        color: #f0eee5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 5vw;
      }
      header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2rem;
        border-bottom: 1px solid #827f75;
        padding-bottom: 1rem;
      }
      h1 {
        max-width: 9ch;
        margin: 12vh 0 3rem;
        font-size: clamp(4rem, 12vw, 11rem);
        line-height: 0.82;
        letter-spacing: -0.06em;
      }
      ol {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        padding: 1px;
        list-style: none;
        background: #827f75;
      }
      li {
        min-height: 12rem;
        padding: 1rem;
        background: #11110f;
      }
      strong {
        display: block;
        color: #9fb5ff;
        font-size: 3rem;
      }
    </style>
  </head>
  <body>
    <header><b>INDEX NOCTURNE</b><span>IMPECCABLE / FIXTURE</span></header>
    <h1>Quiet systems, indexed in the dark.</h1>
    <ol>
      <li><strong>01</strong>Measured hierarchy</li>
      <li><strong>02</strong>Cold registration blue</li>
      <li><strong>03</strong>Edge-to-edge evidence</li>
    </ol>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index Nocturne · Taste fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Georgia, serif;
        background: #090b12;
        color: #f3f0df;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 4vw;
        background:
          radial-gradient(circle at 78% 22%, #1f2d4d, transparent 38%), #090b12;
      }
      nav {
        display: flex;
        justify-content: space-between;
        font:
          0.8rem Arial,
          sans-serif;
        letter-spacing: 0.14em;
      }
      main {
        display: grid;
        grid-template-columns: 1.4fr 0.6fr;
        align-items: end;
        min-height: 76vh;
        gap: 4rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(4rem, 10vw, 9rem);
        font-weight: 400;
        line-height: 0.88;
        letter-spacing: -0.045em;
      }
      aside {
        border-top: 1px solid #7783a2;
        padding-top: 1rem;
        font-size: 1.2rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <nav><b>NOCTURNE STUDY</b><span>TASTE SKILL / FIXTURE</span></nav>
    <main>
      <h1>A night index for deliberate looking.</h1>
      <aside>
        Density recedes. The comparison artifact stays present, measured, and
        calm.
      </aside>
    </main>
  </body>
</html>

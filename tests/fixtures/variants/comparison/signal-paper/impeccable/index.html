<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Paper · Impeccable fixture</title>
    <style>
      :root {
        font-family: Arial, sans-serif;
        background: #f2eddf;
        color: #1c1a17;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 3vw;
      }
      header {
        display: flex;
        justify-content: space-between;
        border-block: 2px solid;
        padding: 0.7rem 0;
        font-weight: 800;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 75vh;
      }
      h1 {
        align-self: center;
        max-width: 8ch;
        font-size: clamp(4rem, 11vw, 10rem);
        line-height: 0.82;
        letter-spacing: -0.06em;
      }
      .signal {
        display: grid;
        place-items: center;
        margin: 3vw 0;
        background: #f04b24;
        color: #171411;
        font-size: clamp(5rem, 18vw, 15rem);
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <header><span>SIGNAL PAPER</span><span>IMPECCABLE / FIXTURE</span></header>
    <main>
      <h1>Proof before polish.</h1>
      <div class="signal">A</div>
    </main>
  </body>
</html>

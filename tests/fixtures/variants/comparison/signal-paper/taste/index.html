<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Paper · Taste fixture</title>
    <style>
      :root {
        font-family: "Arial Narrow", Arial, sans-serif;
        background: #fff7df;
        color: #132b25;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 4vw;
      }
      header {
        display: grid;
        grid-template-columns: 1fr auto;
        padding-bottom: 1rem;
        border-bottom: 1px solid;
      }
      main {
        display: grid;
        grid-template-columns: 0.7fr 1.3fr;
        gap: 2rem;
        padding-top: 4rem;
      }
      .stamp {
        width: 100%;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #176b57;
        color: #fff7df;
        font-size: clamp(4rem, 14vw, 12rem);
      }
      h1 {
        margin: 0;
        align-self: end;
        font-size: clamp(4rem, 10vw, 9rem);
        line-height: 0.86;
        letter-spacing: -0.055em;
      }
    </style>
  </head>
  <body>
    <header><b>FIELD PROOF 02</b><span>TASTE SKILL / FIXTURE</span></header>
    <main>
      <div class="stamp">B</div>
      <h1>Signal carried by paper.</h1>
    </main>
  </body>
</html>
